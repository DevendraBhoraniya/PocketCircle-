services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: pocketcircle_backend_dev
    ports:
      - "8000:8000"
    volumes:
      - ./Backend:/app
      - /app/.venv
    env_file:
      - ./Backend/.env
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    image: node:22-alpine
    container_name: pocketcircle_frontend_dev
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    depends_on:
      - backend

networks:
  default:
    name: pocketcircle_dev_network
